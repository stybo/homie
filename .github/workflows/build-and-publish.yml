name: Build and Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: write
  packages: write

jobs:
  run-qa:
    name: Run QA
    uses: ./.github/workflows/qa.yml

  release:
    name: Release & Deploy
    needs: [run-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump SemVer tag
        id: tag
        uses: mathieudutour/github-tag-action@e1dba6e40b07cbac407df52f2e5ae97c83b5af4c # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          tag_prefix: "v"

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.tag.outputs.new_tag }}" --generate-notes

      - name: Set up Docker Buildx
        if: steps.tag.outputs.new_tag != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: steps.tag.outputs.new_tag != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.tag.outputs.new_tag != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/stybo/homie:latest
            ghcr.io/stybo/homie:${{ steps.tag.outputs.new_tag }}
            ghcr.io/stybo/homie:${{ steps.tag.outputs.new_version }}

      - name: Deploy to Dokploy
        if: steps.tag.outputs.new_tag != ''
        run: curl -s https://dokploy.stybo.nl/api/deploy/compose/_m3o57WZNRgPTeKtMZNHc
