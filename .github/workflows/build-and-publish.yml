name: Build and Publish

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  run-qa:
    name: Run QA
    uses: ./.github/workflows/qa.yml
    secrets: inherit

  build-and-publish:
    name: Build and Publish Image
    needs: [run-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute tags
        id: tags
        run: |
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/stybo/homie:latest
            ghcr.io/stybo/homie:${{ steps.tags.outputs.TAG }}
            ghcr.io/stybo/homie:${{ steps.tags.outputs.VERSION }}

  deploy:
    name: Deploy to Dokploy
    needs: [build-and-publish]
    runs-on: self-hosted
    steps:
      - name: Trigger Dokploy Deployment Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -d '{"ref": "${{ github.ref }}"}' \
            "$DOKPLOY_WEBHOOK_URL"
