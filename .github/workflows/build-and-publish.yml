name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Manual bump type (leave empty for automatic Conventional Commits detection)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - patch
          - minor
          - major
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: write
  packages: write

jobs:
  run-qa:
    name: Run QA
    uses: ./.github/workflows/qa.yml
    secrets: inherit

  bump-and-release:
    name: Calculate SemVer & Release
    needs: [run-qa]
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@e1dba6e40b07cbac407df52f2e5ae97c83b5af4c # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ inputs.bump != '' && inputs.bump || 'false' }}
          tag_prefix: "v"

      - name: Create GitHub Release
        if: steps.tag_version.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.tag_version.outputs.changelog }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
        run: |
          echo "$CHANGELOG" > /tmp/release_notes.md
          gh release create "$NEW_TAG" \
            --title "Release $NEW_TAG" \
            --notes-file /tmp/release_notes.md

  build-and-publish:
    name: Build and Publish Image
    needs: [bump-and-release]
    if: needs.bump-and-release.outputs.new_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          provenance: false
          tags: |
            ghcr.io/stybo/homie:latest
            ghcr.io/stybo/homie:${{ needs.bump-and-release.outputs.new_tag }}
            ghcr.io/stybo/homie:${{ needs.bump-and-release.outputs.new_version }}

  deploy:
    name: Deploy to Dokploy
    needs: [bump-and-release, build-and-publish]
    if: needs.bump-and-release.outputs.new_tag != ''
    runs-on: self-hosted
    steps:
      - name: Trigger Dokploy Deployment Webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -d '{"ref": "refs/tags/${{ needs.bump-and-release.outputs.new_tag }}"}' \
            "$DOKPLOY_WEBHOOK_URL"
